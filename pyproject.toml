[project]
name = "quizzer"
version = "0.1.0"
description = "Turn a filled-in assignment TODO into a short understanding quiz."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
quizzer = "quizzer.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quizzer"]

[tool.pytest.ini_options]
testpaths = ["quizzer/tests"]
pythonpath = ["."]
